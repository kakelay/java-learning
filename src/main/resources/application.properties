
#logging.level.org.springframework=debug
#spring.profiles.active=dev

spring.application.name=myfirstwebapp
spring.messages.encoding=UTF-8

#server.port=8082

# Zipkin configuration
spring.zipkin.base-url=http://localhost:9411
spring.sleuth.sampler.probability=1.0

# Custom logging pattern to include trace and span IDs
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

currency-service.url=https://kakelay-dev.vercel.app/
currency-service.username=default-username
currency-service.key=default-key

#management.endpoints.web.exposure.include=*
#or can use a specific path you want to use:
#management.endpoints.web.exposure.include=health,metrics

# expose actuator fully only in DEV
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# H2 Configuration (commented out for PostgreSQL)
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console
# spring.datasource.url=jdbc:h2:mem:testdb
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/myfirstwebapp
spring.datasource.username=postgres
spring.datasource.password=mypassword
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# For schema.sql initialization
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

server.address=0.0.0.0
 server.port=8080

spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
logging.level.org.springframework=info
logging.level.com.in28minutes.springboot.myfirstwebapp=info



