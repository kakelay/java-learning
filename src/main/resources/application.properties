spring.application.name=myfirstwebapp
spring.messages.encoding=UTF-8
application.version=1.0.0
spring.profiles.active=LOCAL

# =========================
# SERVER
# =========================
server.address=0.0.0.0
server.port=8080

# =========================
# LOGGING
# =========================
logging.level.org.springframework=info
logging.level.com.in28minutes.springboot.myfirstwebapp=info
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# =========================
# ZIPKIN (optional legacy)
# =========================
spring.zipkin.base-url=http://localhost:9411

# =========================
# ACTUATOR (IMPORTANT)
# =========================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# ENABLE PROMETHEUS ENDPOINT
management.endpoint.prometheus.enabled=true

# =========================
# METRICS (FIXED PROPERTY)
# =========================
management.prometheus.metrics.export.enabled=true

# =========================
# DATABASE (POSTGRESQL)
# =========================
spring.datasource.url=jdbc:postgresql://localhost:5432/myfirstwebapp
spring.datasource.username=postgres
spring.datasource.password=mypassword
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# =========================
# JSP VIEW
# =========================
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# =========================
# CUSTOM SERVICE
# =========================
currency-service.url=https://kakelay-dev.vercel.app/
currency-service.username=default-username
currency-service.key=default-key

